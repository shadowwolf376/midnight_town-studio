<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midnight Town Studio</title>
    <style>
        :root {
            --bg-main: #0c0a14;
            --bg-header: rgba(15, 12, 27, 0.95);
            --bg-card: rgba(25, 20, 45, 0.85);
            --text-main: #e2e8f0;
            --accent: #7c3aed;
            --border: rgba(255, 255, 255, 0.12);
        }

        [data-theme="starlight"] {
            --bg-main: #0b1329;
            --bg-header: rgba(15, 23, 42, 0.95);
            --bg-card: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --accent: #3b82f6;
            --border: rgba(255, 255, 255, 0.15);
        }

        [data-theme="dark"] {
            --bg-main: #080808;
            --bg-header: rgba(18, 18, 18, 0.95);
            --bg-card: rgba(30, 30, 30, 0.85);
            --text-main: #ffffff;
            --accent: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            padding: 10px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .character-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #9333ea);
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
        }

        .nav-buttons button, .toolbar button, .toolbar select {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 11px;
            cursor: pointer;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .dropdown-bar {
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .chat-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: radial-gradient(circle at top, rgba(124, 58, 237, 0.15), transparent 70%), var(--bg-main);
        }

        .message-box {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            line-height: 1.4;
            font-size: 14px;
        }

        .input-bar {
            padding: 10px;
            background: var(--bg-header);
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            outline: none;
            font-size: 14px;
        }

        .send-btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: #8b5cf6;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-header);
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 350px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="character-info">
                <div class="avatar" id="headerAvatar"></div>
                <div>
                    <div style="font-weight: bold; font-size: 14px;" id="charNameDisplay">Aira</div>
                    <div style="font-size: 11px; opacity: 0.7;" id="charDescDisplay">Archivist of the Lost Starlight</div>
                </div>
            </div>
            <div class="nav-buttons">
                <button onclick="openPersonaModal()">+ Create Bot</button>
                <button>Settings</button>
                <button onclick="resetChat()">Reset</button>
            </div>
        </div>

        <!-- Bot Selector Dropdown -->
        <select class="dropdown-bar" id="botSelector" onchange="switchBot(this.value)">
            <option value="aira">Aira - Archivist of the Lost Starlight</option>
            <option value="kael">Kael - Rogue Cyberpunk Hacker</option>
            <option value="luna">Luna - Celestial Oracle</option>
        </select>

        <div class="toolbar">
            <select id="themeSelector" onchange="changeTheme(this.value)">
                <option value="midnight">Midnight</option>
                <option value="starlight">Starlight</option>
                <option value="dark">Pure Dark</option>
            </select>
            <button onclick="openPersonaModal()">+ Persona</button>
            <button onclick="exportChat('json')">Export JSON</button>
            <button onclick="exportChat('md')">Export MD</button>
        </div>
    </header>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <!-- Custom Bot Creator Modal -->
    <div class="modal" id="personaModal">
        <div class="modal-content">
            <h3>Create Custom Bot</h3>
            <input type="text" id="newPersonaName" placeholder="Bot Name (e.g., Orion)">
            <input type="text" id="newPersonaTitle" placeholder="Title/Role (e.g., Space Explorer)">
            <textarea id="newPersonaGreeting" placeholder="First greeting message..." rows="3"></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button onclick="closePersonaModal()">Cancel</button>
                <button style="background: var(--accent); color: white;" onclick="savePersona()">Save Bot</button>
            </div>
        </div>
    </div>

    <script>
        // Preset Bots Database
        let bots = {
            "aira": {
                name: "Aira",
                title: "Archivist of the Lost Starlight",
                greeting: "Greetings, traveler of flesh and bone. Step into the candlelight.",
                color: "linear-gradient(135deg, #7c3aed, #9333ea)"
            },
            "kael": {
                name: "Kael",
                title: "Rogue Cyberpunk Hacker",
                greeting: "System online. Keep it brief, kid—the net is crawling with corps tonight.",
                color: "linear-gradient(135deg, #06b6d4, #3b82f6)"
            },
            "luna": {
                name: "Luna",
                title: "Celestial Oracle",
                greeting: "The stars align in your favor. What secrets do you seek from the cosmos?",
                color: "linear-gradient(135deg, #ec4899, #8b5cf6)"
            }
        };

        let currentBotKey = "aira";
        let messages = [];

        function initBot(botKey) {
            currentBotKey = botKey;
            const bot = bots[botKey];
            document.getElementById('charNameDisplay').innerText = bot.name;
            document.getElementById('charDescDisplay').innerText = bot.title;
            document.getElementById('headerAvatar').style.background = bot.color;
            messages = [{ sender: bot.name, text: bot.greeting }];
            renderChat();
        }

        function switchBot(botKey) {
            initBot(botKey);
        }

        function resetChat() {
            initBot(currentBotKey);
        }

        function changeTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        function openPersonaModal() {
            document.getElementById('personaModal').style.display = 'flex';
        }

        function closePersonaModal() {
            document.getElementById('personaModal').style.display = 'none';
        }

        function savePersona() {
            const name = document.getElementById('newPersonaName').value.trim();
            const title = document.getElementById('newPersonaTitle').value.trim();
            const greeting = document.getElementById('newPersonaGreeting').value.trim();

            if(!name) return alert("Please enter a bot name!");

            const botKey = "custom_" + Date.now();
            bots[botKey] = {
                name: name,
                title: title || 'Custom Persona',
                greeting: greeting || `Hello, I am ${name}.`,
                color: "linear-gradient(135deg, #10b981, #3b82f6)"
            };

            // Add to Dropdown Menu
            const selector = document.getElementById('botSelector');
            const option = document.createElement('option');
            option.value = botKey;
            option.innerText = `${name} - ${title || 'Custom Persona'}`;
            selector.appendChild(option);
            selector.value = botKey;

            // Switch to the newly created bot
            initBot(botKey);
            closePersonaModal();

            // Clear inputs
            document.getElementById('newPersonaName').value = '';
            document.getElementById('newPersonaTitle').value = '';
            document.getElementById('newPersonaGreeting').value = '';
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            messages.push({ sender: "You", text: text });
            input.value = "";
            renderChat();

            const bot = bots[currentBotKey];
            setTimeout(() => {
                messages.push({ sender: bot.name, text: `I hear you talking about "${text}". Tell me more.` });
                renderChat();
            }, 1000);
        }

        function renderChat() {
            const container = document.getElementById('chatContainer');
            const bot = bots[currentBotKey];
            container.innerHTML = messages.map(m => `
                <div>
                    <div class="message-box" style="${m.sender === 'You' ? 'margin-left: auto; background: var(--accent); color: white;' : ''}">
                        <strong>${m.sender}:</strong> ${m.text}
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function exportChat(format) {
            let dataStr, filename;
            if (format === 'json') {
                dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(messages, null, 2));
                filename = `${bots[currentBotKey].name}-chat.json`;
            } else {
                let mdContent = messages.map(m => `**${m.sender}**: ${m.text}\n`).join('\n');
                dataStr = "data:text/markdown;charset=utf-8," + encodeURIComponent(mdContent);
                filename = `${bots[currentBotKey].name}-chat.md`;
            }
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", filename);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Initialize on Load
        initBot("aira");
    </script>
</body>
</html>
