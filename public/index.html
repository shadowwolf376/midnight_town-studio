<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Town Studio Pro</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
html,body{height:100%;background:#0f0f14;color:#e0e0e0;display:flex;flex-direction:column;overflow:hidden;}
#bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;background-size:cover;background-position:center;filter:brightness(0.25) blur(4px);pointer-events:none;}
#sprite-layer{position:absolute;bottom:0;right:10px;height:55%;max-height:400px;z-index:1;pointer-events:none;opacity:0.85;}
header,#chat-box,footer,.modal{position:relative;z-index:2;}
header{background:rgba(26,26,36,0.95);padding:8px 10px;border-bottom:1px solid #3d3d4e;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.top{display:flex;justify-content:space-between;align-items:center;}
.info{display:flex;align-items:center;gap:8px;}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid #7c3aed;}
.btns{display:flex;gap:4px;flex-wrap:wrap;}
.btn{background:#1a1a24;color:#ccc;border:1px solid #3d3d4e;padding:4px 8px;border-radius:6px;font-size:0.7rem;cursor:pointer;}
.btn-accent{background:#7c3aed;color:#fff;border:none;}
select{width:100%;background:#121218;border:1px solid #3d3d4e;color:#fff;padding:5px;border-radius:6px;font-size:0.8rem;}
#chat-box{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.msg-wrap{display:flex;flex-direction:column;max-width:88%;gap:2px;}
.msg-wrap.user{align-self:flex-end;}
.msg-wrap.bot{align-self:flex-start;}
.msg{padding:8px 12px;border-radius:8px;font-size:0.9rem;line-height:1.4;}
.user .msg{background:#7c3aed;color:#fff;}
.bot .msg{background:#1a1a24;color:#ddd;border:1px solid #3d3d4e;}
.bot .msg span.dialogue{color:#fef08a;font-weight:500;}
.tools{display:flex;gap:8px;font-size:0.65rem;color:#888;padding:0 2px;align-items:center;}
.tools span{cursor:pointer;}
.swipe-btn{color:#a78bfa;font-weight:bold;padding:0 4px;user-select:none;cursor:pointer;}
footer{background:rgba(26,26,36,0.95);padding:8px 10px;display:flex;gap:6px;border-top:1px solid #3d3d4e;flex-shrink:0;}
input,textarea{width:100%;background:#121218;border:1px solid #3d3d4e;color:#fff;padding:8px;border-radius:6px;font-size:0.9rem;}
#inp{flex:1;}
#send{padding:8px 14px;background:#7c3aed;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;padding:15px;z-index:100;}
.modal-content{background:#1a1a24;border:1px solid #3d3d4e;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;border-radius:10px;padding:15px;display:flex;flex-direction:column;gap:10px;}
.list-item{background:#121218;padding:8px;border-radius:6px;border:1px solid #3d3d4e;display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;}
</style>
</head>
<body>
<div id="bg"></div><img id="sprite-layer" src="" style="display:none;"/>

<header>
  <div class="top">
    <div class="info">
      <img id="av" class="av" src=""/>
      <div><h1 id="cn" style="font-size:0.95rem;color:#a78bfa;">Midnight Town Studio</h1><p id="ct" style="font-size:0.65rem;color:#aaa;"></p></div>
    </div>
    <div class="btns">
      <button class="btn" onclick="openModal('p-mod')">Persona</button>
      <button class="btn" onclick="openModal('l-mod')">Lore</button>
      <button class="btn" onclick="openModal('s-mod')">Settings</button>
      <button class="btn" onclick="openModal('sess-mod')">Sessions</button>
      <button class="btn" onclick="resetChat()">Reset</button>
    </div>
  </div>
  <select id="sel" onchange="switchChar(this.value)"></select>
</header>

<div id="chat-box"></div>

<footer>
  <input id="inp" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()"/>
  <button id="send" onclick="send()">Send</button>
</footer>

<div id="p-mod" class="modal"><div class="modal-content">
  <h3>User Persona</h3>
  <textarea id="persona-in" placeholder="Describe your character..." style="height:80px;"></textarea>
  <div style="display:flex;gap:5px;justify-content:flex-end;"><button class="btn" onclick="closeModal('p-mod')">Cancel</button><button class="btn btn-accent" onclick="savePersona()">Save</button></div>
</div></div>

<div id="l-mod" class="modal"><div class="modal-content">
  <h3>World Lorebook Manager</h3>
  <div id="lore-list" style="display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;"></div>
  <hr style="border-color:#3d3d4e;">
  <input id="nl-keys" placeholder="Keywords (comma separated)"/>
  <textarea id="nl-cont" placeholder="Lore content description..." style="height:50px;"></textarea>
  <div style="display:flex;gap:5px;justify-content:flex-end;"><button class="btn" onclick="closeModal('l-mod')">Close</button><button class="btn btn-accent" onclick="addLore()">Add Entry</button></div>
</div></div>

<div id="s-mod" class="modal"><div class="modal-content">
  <h3>AI Settings & Scene Steering</h3>
  <label style="font-size:0.8rem;">Author Note:</label>
  <textarea id="set-an" placeholder="e.g. [Style: Dark, suspenseful.]" style="height:50px;"></textarea>
  <label style="font-size:0.8rem;">Model:</label>
  <input id="set-model" value="nvidia/nemotron-3.5-lightning:free"/>
  <label style="font-size:0.8rem;">Temperature (<span id="temp-val">0.8</span>):</label>
  <input type="range" id="set-temp" min="0.1" max="2.0" step="0.1" value="0.8" oninput="document.getElementById('temp-val').innerText=this.value"/>
  <label style="font-size:0.8rem;">Max Tokens:</label>
  <input type="number" id="set-tokens" value="600"/>
  <hr style="border-color:#3d3d4e;">
  <input type="file" id="import-file" accept=".json" onchange="importCharJSON(event)"/>
  <button class="btn" style="margin-top:4px;" onclick="exportCurrentChar()">Export Character JSON</button>
  <div style="display:flex;gap:5px;justify-content:flex-end;margin-top:5px;"><button class="btn" onclick="closeModal('s-mod')">Cancel</button><button class="btn btn-accent" onclick="saveSettings()">Save</button></div>
</div></div>

<div id="sess-mod" class="modal"><div class="modal-content">
  <h3>Chat Session Manager</h3>
  <div id="sess-list" style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;"></div>
  <hr style="border-color:#3d3d4e;">
  <input id="new-sess-name" placeholder="Session Bookmark Name..."/>
  <div style="display:flex;gap:5px;justify-content:flex-end;"><button class="btn" onclick="closeModal('sess-mod')">Close</button><button class="btn btn-accent" onclick="saveSession()">Bookmark</button></div>
</div></div>

<script>
let activeChar = {}, userPersona = "", lorebook = [];
let swipeBranches = {};
let lastBotMsgId = null;

async function load() {
  let r = await fetch("/characters"); let d = await r.json();
  userPersona = d.userPersona || ""; lorebook = d.lorebook || [];
  document.getElementById("set-an").value = d.authorNote || "";
  let s = document.getElementById("sel"); s.innerHTML = "";
  d.list.forEach(c => {
    let o = document.createElement("option"); o.value = c.id; o.text = c.name + " - " + c.title;
    if(c.id===d.active) o.selected = true; s.appendChild(o);
  });
  switchChar(d.active); renderLoreList();
}

async function switchChar(id) {
  let r = await fetch("/select-character", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({characterId:id})});
  activeChar = await r.json();
  document.getElementById("cn").innerText = activeChar.name;
  document.getElementById("ct").innerText = activeChar.title;
  document.getElementById("av").src = activeChar.avatar || "";
  document.getElementById("bg").style.backgroundImage = activeChar.background ? "url('" + activeChar.background + "')" : "none";
  let sp = document.getElementById("sprite-layer");
  if(activeChar.sprite) { sp.src = activeChar.sprite; sp.style.display="block"; } else { sp.style.display="none"; }
  
  swipeBranches = {};
  let cb = document.getElementById("chat-box"); cb.innerHTML = "";
  appendMsg({role:"assistant", content: activeChar.greetings ? activeChar.greetings[0] : "Hello."});
}

function formatDialogue(raw) {
  return marked.parse(raw).replace(/"([^"]+)"/g, '<span class="dialogue">"$1"</span>');
}

function appendMsg(msgObj) {
  let cb = document.getElementById("chat-box");
  let msgId = msgObj.id || ("msg_" + cb.children.length);
  
  if (msgObj.role === "assistant") {
    lastBotMsgId = msgId;
    if (!swipeBranches[msgId]) {
      swipeBranches[msgId] = { options: [msgObj.content], index: 0 };
    } else if (msgObj.newOption) {
      swipeBranches[msgId].options.push(msgObj.content);
      swipeBranches[msgId].index = swipeBranches[msgId].options.length - 1;
    }
  }

  let existingWrap = document.getElementById(msgId);
  let w = existingWrap || document.createElement("div");
  w.id = msgId;
  w.className = "msg-wrap " + (msgObj.role === "user" ? "user" : "bot");
  w.innerHTML = "";

  let displayContent = msgObj.role === "assistant" ? swipeBranches[msgId].options[swipeBranches[msgId].index] : msgObj.content;

  let m = document.createElement("div"); m.className = "msg";
  m.innerHTML = msgObj.role === "assistant" ? formatDialogue(displayContent) : marked.parse(displayContent);
  w.appendChild(m);

  let t = document.createElement("div"); t.className = "tools";
  if (msgObj.role === "assistant") {
    let b = swipeBranches[msgId];
    let swipeUI = b.options.length > 1 ? `<span class="swipe-btn" onclick="swipe('${msgId}', -1)">&lt;</span> ${b.index + 1}/${b.options.length} <span class="swipe-btn" onclick="swipe('${msgId}', 1)">&gt;</span> ` : "";
    t.innerHTML = swipeUI + `<span onclick="regen('${msgId}')">Regenerate</span>`;
  } else {
    t.innerHTML = '<span onclick="editMsg(this)">Edit</span>';
  }

  w.appendChild(t);
  if (!existingWrap) cb.appendChild(w);
  cb.scrollTop = cb.scrollHeight;
}

function swipe(msgId, dir) {
  let b = swipeBranches[msgId];
  if (!b) return;
  b.index = (b.index + dir + b.options.length) % b.options.length;
  appendMsg({ id: msgId, role: "assistant", content: b.options[b.index] });
}

async function regen(msgId) {
  let idToRegen = msgId || lastBotMsgId;
  let r = await fetch("/chat", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userMessage:"[Regenerate response]", regenerate:true})});
  let d = await r.json();
  if (d.reply) {
    appendMsg({ id: idToRegen, role: "assistant", content: d.reply, newOption: true });
  }
}

function editMsg(el) {
  let m = el.closest(".msg-wrap").querySelector(".msg");
  let n = prompt("Edit message:", m.innerText);
  if(n!==null) m.innerText = n;
}

async function resetChat() { await fetch("/chat", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clearHistory:true})}); load(); }
function openModal(id){ if(id === 'sess-mod') loadSessions(); document.getElementById(id).style.display="flex"; }
function closeModal(id){ document.getElementById(id).style.display="none"; }

async function savePersona() {
  userPersona = document.getElementById("persona-in").value;
  await fetch("/update-meta", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userPersona})});
  closeModal('p-mod');
}

function renderLoreList() {
  let list = document.getElementById("lore-list"); list.innerHTML = "";
  lorebook.forEach((l, idx) => {
    let div = document.createElement("div"); div.className = "list-item";
    div.innerHTML = `<div><strong>Keys: ${l.keys}</strong><br><small>${l.content}</small></div><button class="btn" style="background:#b91c1c;color:#fff;" onclick="deleteLore(${idx})">Del</button>`;
    list.appendChild(div);
  });
}

async function addLore() {
  let keys = document.getElementById("nl-keys").value, content = document.getElementById("nl-cont").value;
  let r = await fetch("/manage-lore", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"add", entry:{keys, content}})});
  let d = await r.json(); lorebook = d.lorebook; renderLoreList();
  document.getElementById("nl-keys").value=""; document.getElementById("nl-cont").value="";
}

async function deleteLore(idx) {
  let r = await fetch("/manage-lore", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"delete", index:idx})});
  let d = await r.json(); lorebook = d.lorebook; renderLoreList();
}

async function saveSettings() {
  let model = document.getElementById("set-model").value;
  let temperature = document.getElementById("set-temp").value;
  let maxTokens = document.getElementById("set-tokens").value;
  let authorNote = document.getElementById("set-an").value;
  await fetch("/update-settings", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model, temperature, maxTokens})});
  await fetch("/update-meta", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({authorNote})});
  closeModal('s-mod');
}

async function loadSessions() {
  let r = await fetch("/get-sessions"); let d = await r.json();
  let list = document.getElementById("sess-list"); list.innerHTML = "";
  (d.sessions || []).forEach((s, idx) => {
    let div = document.createElement("div"); div.className = "list-item";
    div.innerHTML = `<span>${s.name}</span><button class="btn btn-accent" onclick="restoreSession(${idx})">Load</button>`;
    list.appendChild(div);
  });
}

async function saveSession() {
  let name = document.getElementById("new-sess-name").value.trim(); if(!name) return;
  await fetch("/save-session", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
  document.getElementById("new-sess-name").value = ""; loadSessions();
}

async function restoreSession(idx) {
  let r = await fetch("/load-session", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({index:idx})});
  let d = await r.json();
  if(d.history) {
    let cb = document.getElementById("chat-box"); cb.innerHTML = "";
    d.history.forEach(m => appendMsg({role: m.role, content: m.content}));
    closeModal("sess-mod");
  }
}

function exportCurrentChar() {
  let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activeChar, null, 2));
  let dlAnchor = document.createElement("a"); dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", activeChar.name + ".json"); dlAnchor.click();
}

function importCharJSON(e) {
  let file = e.target.files[0]; if(!file) return;
  let reader = new FileReader();
  reader.onload = async function(evt) {
    try {
      let character = JSON.parse(evt.target.result);
      let r = await fetch("/import-character", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({character})});
      let d = await r.json();
      if(d.success) { closeModal('s-mod'); load(); }
    } catch(err) { alert("Invalid JSON."); }
  };
  reader.readAsText(file);
}

load();
</script>
</body>
</html>
