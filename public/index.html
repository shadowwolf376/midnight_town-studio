<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidnightLab</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 15px 15px 90px 15px; 
            background: #0b071e; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .app-view { display: none; }
        #view-home { display: block; }
        .card { 
            background: #150f2e; 
            border: 1px solid #2a1f52; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 12px; 
        }
        input, textarea { 
            width: 100%; 
            background: #0b071e; 
            border: 1px solid #2a1f52; 
            color: #fff; 
            padding: 10px; 
            border-radius: 8px; 
            outline: none; 
            margin-top: 6px; 
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 90px; }
        .sub-btn { 
            background: #150f2e; 
            color: #aaa; 
            border: 1px solid #2a1f52; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .sub-btn.active { 
            background: #ff6600; 
            color: #fff; 
            border: none; 
        }
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #0b071e; 
            border-top: 1px solid #2a1f52; 
            display: flex; 
            justify-content: space-around; 
            padding: 10px 0; 
            z-index: 1000; 
        }
        .nav-btn { 
            background: none; 
            border: none; 
            color: #aaa; 
            font-size: 11px; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <h1 style="margin:0;font-size:20px;color:#ff6600;display:flex;align-items:center;gap:6px">🔥 MidnightLab</h1>
        <button onclick="switchView('create')" style="background:#ff6600;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer">+ Create</button>
    </div>

    <!-- HOME VIEW -->
    <div id="view-home" class="app-view">
        
                <div style="font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">The room falls into a tense space as you...</div>
            </div>
            <div style="font-size:10px;color:#777;text-align:right">2d ago</div>
        </div>
    </div>

    <!-- PROFILE VIEW -->
    <div id="view-profile" class="app-view">
        <h2 style="color:#fff;margin-top:0;font-size:18px">👤 Creator Profile</h2>
        <div class="card">
            <h3 style="margin:0 0 6px 0;color:#ff6600">@You</h3>
            <p style="color:#aaa;font-size:12px;margin:0">Manage your published scenarios and account settings.</p>
        </div>
        <div class="card">
            <h3 style="margin:0 0 8px 0;font-size:14px;color:#fff">⚙️ Settings</h3>
            <button style="background:#251a52;color:#fff;border:1px solid #2a1f52;padding:10px;border-radius:8px;font-size:12px;width:100%;font-weight:bold;cursor:pointer">🔑 Configure API Key & Model</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="switchView('home')">🏠 Home</button>
        <button class="nav-btn" onclick="switchView('search')">🔍 Search</button>
        <button class="nav-btn" onclick="switchView('create')">➕ Create</button>
        <button class="nav-btn" onclick="switchView('chats')">💬 Chats</button>
        <button class="nav-btn" onclick="switchView('profile')">👤 Profile</button>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        function switchView(v) {
            ['home', 'search', 'create', 'chats', 'profile'].forEach(id => {
                const el = document.getElementById('view-' + id);
                if (el) el.style.display = (id === v) ? 'block' : 'none';
            });
            window.scrollTo(0, 0);
        }

        function switchCreateTab(tab) {
            ['details', 'intro', 'story', 'lore'].forEach(t => {
                const p = document.getElementById('create-panel-' + t);
                const b = document.getElementById('btn-create-' + t);
                if (p) p.style.display = (t === tab) ? 'block' : 'none';
                if (b) {
                    if (t === tab) {
                        b.classList.add('active');
                    } else {
                        b.classList.remove('active');
                    }
                }
            });
        }
    </script>
</body>
</html>
