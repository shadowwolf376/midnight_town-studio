<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MidnightLab</title><style>body{background:#0b071e;color:#fff;font-family:sans-serif;margin:0;padding-bottom:80px}.app-view{display:none;padding:15px}.app-view.active{display:block}</style></head><body><div id="view-home" class="app-view active"><h2 style="color:#ff6600">🔥 MidnightLab</h2><div style="background:#150f2e;padding:15px;border-radius:12px;border:1px solid #2a1f52"><h3 style="margin:0 0 8px">The Lost Archivist</h3><button onclick="openChat('The Lost Archivist')" style="background:#ff6600;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-weight:bold">Start Chat</button></div></div><div id="view-search" class="app-view"><h2>Search</h2><input placeholder="Search..." style="width:100%;padding:8px;background:#150f2e;color:#fff;border:1px solid #2a1f52;border-radius:6px"></div><div id="view-create" class="app-view"><h2>Create Scenario</h2><input id="new-name" placeholder="Name" style="width:100%;padding:8px;background:#150f2e;color:#fff;border:1px solid #2a1f52;border-radius:6px;margin-bottom:8px"><textarea id="new-msg" placeholder="Greeting" style="width:100%;height:80px;background:#150f2e;color:#fff;border:1px solid #2a1f52;border-radius:6px"></textarea><button onclick="saveNewScenario()" style="background:#ff6600;color:#fff;border:none;padding:8px 16px;border-radius:6px;margin-top:8px;font-weight:bold">Publish</button></div><div id="view-chats" class="app-view"></div><div id="view-profile" class="app-view"><h2>Profile</h2><button onclick="switchView('lorebook')" style="width:100%;background:#251a52;color:#fff;border:1px solid #2a1f52;padding:12px;border-radius:8px;font-weight:bold">📖 Open World Lorebook</button></div><div id="view-lorebook" class="app-view"><button onclick="switchView('profile')" style="background:#251a52;color:#fff;border:1px solid #2a1f52;padding:6px 12px;border-radius:6px">← Back</button><h2>Lorebook</h2><input id="lore-title" placeholder="Title" style="width:100%;padding:8px;background:#150f2e;color:#fff;border:1px solid #2a1f52;border-radius:6px;margin-bottom:8px"><textarea id="lore-content" placeholder="Content" style="width:100%;height:80px;background:#150f2e;color:#fff;border:1px solid #2a1f52;border-radius:6px"></textarea><button onclick="saveLoreEntry()" style="background:#ff6600;color:#fff;border:none;padding:8px 16px;border-radius:6px;margin-top:8px;font-weight:bold">Save</button><div id="lore-list" style="margin-top:12px"></div></div><div style="position:fixed;bottom:0;left:0;right:0;background:#0f0a24;border-top:1px solid #2a1f52;display:flex;justify-content:space-around;padding:10px"><button onclick="switchView('home')" style="background:none;border:none;color:#aaa">Home</button><button onclick="switchView('search')" style="background:none;border:none;color:#aaa">Search</button><button onclick="switchView('create')" style="background:none;border:none;color:#aaa">Create</button><button onclick="switchView('chats')" style="background:none;border:none;color:#aaa">Chats</button><button onclick="switchView('profile')" style="background:none;border:none;color:#aaa">Profile</button></div><script src="script.js"></script><script src="chats.js"></script><script src="lorebook.js"></script></body></html>
